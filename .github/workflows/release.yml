name: release

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: Release increment type. If the current package version is a prerelease, its stable base version is released, e.g. 3.19.0-dev.18 -> 3.19.0.
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major
            release_notes_file:
                description: Path to a committed Markdown release notes file, e.g. .github/release-notes/3.19.0.md. Required for minor/major releases; optional for patch releases.
                required: false
                type: string
            codename:
                description: Release codename (e.g. Strawberry). Enter just the name, not the full "Viewer X.Y.Z - Codename" format. Optional, but recommended for minor/major releases.
                required: false
                type: string
            skip_tests:
                description: Skip the release full Playwright gate for emergency patch releases. Use only when the exact commit was validated separately.
                required: false
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: full-playwright-latest-test-cdn
    cancel-in-progress: false

jobs:
    check-full-tests:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            full_tests_done: ${{ steps.check.outputs.full_tests_done }}

        steps:
            - name: Check full Playwright status for this commit
              id: check
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  SKIP_TESTS: ${{ inputs.skip_tests }}
              run: |
                  if [[ "${SKIP_TESTS}" == "true" ]]; then
                    echo "full_tests_done=true" >> "$GITHUB_OUTPUT"
                    echo "Release full Playwright gate skipped by workflow_dispatch input."
                    exit 0
                  fi

                  COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/statuses" \
                    --jq '[.[] | select(.context == "viewer/full-playwright" and .state == "success")] | length')

                  if [[ "$COUNT" -gt 0 ]]; then
                    echo "full_tests_done=true" >> "$GITHUB_OUTPUT"
                    echo "Full Playwright suite already passed for ${GITHUB_SHA}."
                  else
                    echo "full_tests_done=false" >> "$GITHUB_OUTPUT"
                    echo "Full Playwright suite has not passed for ${GITHUB_SHA}; release will run it."
                  fi

    prepare:
        needs: check-full-tests
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        environment: production
        outputs:
            version: ${{ steps.version.outputs.version }}

        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  token: ${{ steps.app-token.outputs.token }}

            - name: Validate release notes
              shell: bash
              env:
                  RELEASE_TYPE: ${{ inputs.release_type }}
                  RELEASE_NOTES_FILE: ${{ inputs.release_notes_file }}
              run: |
                  if [[ -z "${RELEASE_NOTES_FILE}" ]]; then
                    if [[ "${RELEASE_TYPE}" != "patch" ]]; then
                      echo "release_notes_file is required for minor and major releases." >&2
                      exit 1
                    fi
                    exit 0
                  fi

                  if [[ ! -f "${RELEASE_NOTES_FILE}" ]]; then
                    echo "release_notes_file does not exist: ${RELEASE_NOTES_FILE}" >&2
                    exit 1
                  fi

                  if [[ "${RELEASE_TYPE}" != "patch" && ! -s "${RELEASE_NOTES_FILE}" ]]; then
                    echo "release_notes_file must not be empty for minor and major releases." >&2
                    exit 1
                  fi

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 11.3.0

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24.12.0
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Pin npm
              run: npm i -g npm@11.18.0

            - name: Show tool versions
              run: |
                  node -v
                  npm -v
                  pnpm -v

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck workflow scripts
              run: npm run check:scripts

            - name: Configure git user
              shell: bash
              run: |
                  APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
                  USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
                  git config user.name "${APP_SLUG}[bot]"
                  git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Compute release version
              id: version
              shell: bash
              env:
                  RELEASE_TYPE: ${{ inputs.release_type }}
              run: |
                  case "$RELEASE_TYPE" in
                    patch|minor|major) ;;
                    *)
                      echo "Invalid release type: $RELEASE_TYPE" >&2
                      exit 1
                      ;;
                  esac

                  VERSION_JSON=$(npx ts-node -T scripts/release/compute-version.ts --channel release --release-type "$RELEASE_TYPE" --yes)
                  VERSION=$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$VERSION_JSON")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Computed version: $VERSION"

            - name: Notify Slack deployment started
              continue-on-error: true
              shell: bash
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                  WORKFLOW: ${{ github.workflow }}
                  BRANCH: ${{ github.ref_name }}
                  SHA: ${{ github.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
                    echo "SLACK_WEBHOOK_URL not configured; skipping Slack notification."
                    exit 0
                  fi

                  SHORT_SHA="${SHA:0:7}"
                  PAYLOAD="$(jq -cn \
                    --arg workflow "$WORKFLOW" \
                    --arg version "$VERSION" \
                    --arg branch "$BRANCH" \
                    --arg commitUrl "$COMMIT_URL" \
                    --arg shortSha "$SHORT_SHA" \
                    --arg runUrl "$RUN_URL" \
                    '{attachments:[{color:"#1d9bf0",blocks:[{type:"section",text:{type:"mrkdwn",text:":rocket: *Deployment started*"}},{type:"section",fields:[{type:"mrkdwn",text:"*Status:*\nIn progress"},{type:"mrkdwn",text:("*Workflow:*\n" + $workflow)},{type:"mrkdwn",text:("*Version:*\n`" + $version + "`")},{type:"mrkdwn",text:("*Branch:*\n`" + $branch + "`")},{type:"mrkdwn",text:("*Commit:*\n<" + $commitUrl + "|`" + $shortSha + "`>")} ]},{type:"actions",elements:[{type:"button",text:{type:"plain_text",text:"View Run"},url:$runUrl,style:"primary"}]}]}]}')"

                  curl -sS --max-time 15 -X POST -H "Content-type: application/json" --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" >/dev/null || echo "Slack notification failed."

            - name: Version packages (no tag yet)
              run: |
                  npx lerna version "${{ steps.version.outputs.version }}" \
                    --yes \
                    --no-private \
                    --exact \
                    --force-publish \
                    --no-git-tag-version \
                    --no-push

            - name: Generate build data
              shell: bash
              run: |
                  BUILD_VERSION="${{ steps.version.outputs.version }}" \
                  BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  GITHUB_SHA="${{ github.sha }}" \
                  GITHUB_REF_NAME="main" \
                  npx ts-node -T scripts/release/generate-build-data.ts

            - name: Build packages
              run: pnpm build

            - name: Build test assets
              run: pnpm build-tests

            - name: Configure AWS credentials for full Playwright test-cdn
              if: needs.check-full-tests.outputs.full_tests_done != 'true'
              uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Deploy latest test-cdn for full Playwright
              if: needs.check-full-tests.outputs.full_tests_done != 'true'
              run: npm run deploy-tests
              env:
                  VIEWER_TEST_ENV: production

            - name: Install Playwright browser
              if: needs.check-full-tests.outputs.full_tests_done != 'true'
              run: npm run test-install

            - name: Smoke test latest test-cdn for full Playwright
              if: needs.check-full-tests.outputs.full_tests_done != 'true'
              run: npm run test:smoke-cdn
              env:
                  VIEWER_TEST_ENV: production

            - name: Collect prepare failure artifacts
              if: failure()
              shell: bash
              run: |
                  rm -rf .github-artifacts/failure
                  mkdir -p .github-artifacts/failure/tests

                  if [[ -f lerna-debug.log ]]; then
                    cp lerna-debug.log .github-artifacts/failure/
                  fi

                  if [[ -d tests/playwright-report ]]; then
                    cp -R tests/playwright-report .github-artifacts/failure/tests/
                  fi

                  if [[ -d tests/test-results ]]; then
                    cp -R tests/test-results .github-artifacts/failure/tests/
                  fi

            - name: Upload prepare failure artifacts
              if: failure()
              timeout-minutes: 5
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: release-prepare-failure-artifacts
                  if-no-files-found: ignore
                  compression-level: 0
                  path: .github-artifacts/failure/

    playwright:
        needs:
            - check-full-tests
            - prepare
        if: github.ref == 'refs/heads/main' && needs.check-full-tests.outputs.full_tests_done != 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    - shard: 1/8
                      shard_name: 1-of-8
                    - shard: 2/8
                      shard_name: 2-of-8
                    - shard: 3/8
                      shard_name: 3-of-8
                    - shard: 4/8
                      shard_name: 4-of-8
                    - shard: 5/8
                      shard_name: 5-of-8
                    - shard: 6/8
                      shard_name: 6-of-8
                    - shard: 7/8
                      shard_name: 7-of-8
                    - shard: 8/8
                      shard_name: 8-of-8

        steps:
            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 11.3.0

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24.12.0
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Pin npm
              run: npm i -g npm@11.18.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browser
              run: npm run test-install

            - name: Run Playwright shard ${{ matrix.shard }} against latest test-cdn
              run: npx playwright test --config tests/playwright.config.ts --shard=${{ matrix.shard }}
              env:
                  VIEWER_TEST_ENV: production

            - name: Collect shard failure artifacts
              if: failure()
              shell: bash
              run: |
                  rm -rf .github-artifacts/failure
                  mkdir -p .github-artifacts/failure/tests

                  if [[ -d tests/playwright-report ]]; then
                    cp -R tests/playwright-report .github-artifacts/failure/tests/
                  fi

                  if [[ -d tests/test-results ]]; then
                    cp -R tests/test-results .github-artifacts/failure/tests/
                  fi

            - name: Upload shard failure artifacts
              if: failure()
              timeout-minutes: 5
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: release-playwright-shard-${{ matrix.shard_name }}-failure-artifacts
                  if-no-files-found: ignore
                  compression-level: 0
                  path: .github-artifacts/failure/

    record-full-test-status:
        needs:
            - check-full-tests
            - prepare
            - playwright
        if: always() && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            statuses: write

        steps:
            - name: Record full Playwright status
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  SKIP_TESTS: ${{ inputs.skip_tests }}
              run: |
                  if [[ "${SKIP_TESTS}" == "true" ]]; then
                    echo "Full Playwright status recording skipped by workflow_dispatch input."
                    exit 0
                  fi

                  if [[ "${{ needs.check-full-tests.outputs.full_tests_done }}" == "true" ]]; then
                    echo "Full Playwright suite was already recorded for ${GITHUB_SHA}."
                    exit 0
                  fi

                  if [[ "${{ needs.prepare.result }}" == "success" && "${{ needs.playwright.result }}" == "success" ]]; then
                    STATE="success"
                    DESCRIPTION="Full Playwright suite passed"
                  else
                    STATE="failure"
                    DESCRIPTION="Full Playwright suite failed"
                  fi

                  gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                    -f state="$STATE" \
                    -f context="viewer/full-playwright" \
                    -f description="$DESCRIPTION" \
                    -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

                  [[ "$STATE" == "success" ]]

    finalize:
        needs:
            - prepare
            - playwright
            - record-full-test-status
        if: >-
            always() &&
            github.ref == 'refs/heads/main' &&
            needs.prepare.result == 'success' &&
            (needs.playwright.result == 'success' || needs.playwright.result == 'skipped') &&
            needs.record-full-test-status.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            id-token: write
        environment: production

        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 11.3.0

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24.12.0
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Pin npm
              run: npm i -g npm@11.18.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck workflow scripts
              run: npm run check:scripts

            - name: Configure git user
              shell: bash
              run: |
                  APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
                  USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
                  git config user.name "${APP_SLUG}[bot]"
                  git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Version packages (no tag yet)
              run: |
                  npx lerna version "${{ needs.prepare.outputs.version }}" \
                    --yes \
                    --no-private \
                    --exact \
                    --force-publish \
                    --no-git-tag-version \
                    --no-push

            - name: Generate build data
              shell: bash
              run: |
                  BUILD_VERSION="${{ needs.prepare.outputs.version }}" \
                  BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  GITHUB_SHA="${{ github.sha }}" \
                  GITHUB_REF_NAME="main" \
                  npx ts-node -T scripts/release/generate-build-data.ts

            - name: Build packages
              run: pnpm build

            - name: Build test assets
              run: pnpm build-tests

            - name: Build examples
              run: pnpm build-examples

            - name: Build docs
              run: pnpm doc

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Deploy docs (versioned)
              run: npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version "${{ needs.prepare.outputs.version }}" --source-dir ./docs --target-name api --yes

            - name: Deploy CDN example (versioned)
              run: |
                  npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version "${{ needs.prepare.outputs.version }}" --source-dir ./examples/cdn/dist --target-name cdn --yes
                  npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version "${{ needs.prepare.outputs.version }}" --source-dir ./examples/cdn/dist --yes

            - name: Deploy glTF example (versioned)
              run: npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version "${{ needs.prepare.outputs.version }}" --source-dir ./examples/gltf/dist --target-name gltf --yes

            - name: Deploy main pages (versioned)
              run: npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version "${{ needs.prepare.outputs.version }}" --source-dir ./examples/main-pages --yes

            - name: Deploy test-cdn (versioned)
              run: npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version "${{ needs.prepare.outputs.version }}" --source-dir ./examples/test-cdn/dist --test-cdn --yes

            - name: Install Playwright browser
              run: npm run test-install

            - name: Smoke test deployed versioned test-cdn
              run: npm run test:smoke-cdn
              env:
                  VIEWER_TEST_BASE_URL: https://viewer.shapediver.com/v3/${{ needs.prepare.outputs.version }}

            - name: Commit version bump locally
              shell: bash
              run: |
                  git add -A
                  git commit -m "chore(release): release ${{ needs.prepare.outputs.version }}"

            - name: Setup Node.js for GitHub Packages publish
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24.12.0
                  scope: "@shapediver"
                  registry-url: https://npm.pkg.github.com

            - name: Publish GitHub Packages (latest)
              run: npx ts-node -T scripts/publish/publish-github.ts --tag latest --yes
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}

            - name: Setup Node.js for npm publish
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24.12.0
                  scope: "@shapediver"
                  registry-url: https://registry.npmjs.org

            - name: Configure npm registry for npmjs publish
              id: npmjs-npmrc
              shell: bash
              run: |
                  NPMJS_NPMRC="${RUNNER_TEMP}/npmjs.npmrc"
                  npm config delete always-auth --location=user || true
                  cat > "${NPMJS_NPMRC}" <<'EOF'
                  registry=https://registry.npmjs.org/
                  @shapediver:registry=https://registry.npmjs.org/
                  EOF
                  echo "path=${NPMJS_NPMRC}" >> "${GITHUB_OUTPUT}"
                  npm --userconfig "${NPMJS_NPMRC}" config get @shapediver:registry

            - name: Publish npm (latest)
              run: npx ts-node -T scripts/publish/publish-npm.ts --yes
              env:
                  NPM_CONFIG_USERCONFIG: ${{ steps.npmjs-npmrc.outputs.path }}

            - name: Deploy latest
              run: |
                  npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version latest --source-dir ./docs --target-name api --yes
                  npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version latest --source-dir ./examples/cdn/dist --target-name cdn --yes
                  npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version latest --source-dir ./examples/cdn/dist --yes
                  npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version latest --source-dir ./examples/gltf/dist --target-name gltf --yes
                  npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version latest --source-dir ./examples/main-pages --yes
                  npx ts-node -T scripts/deploy/deploy-s3.ts --channel release --version latest --source-dir ./examples/test-cdn/dist --test-cdn --yes

            - name: Push release commit and tag
              shell: bash
              env:
                  PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
                  git tag -a "viewer@${{ needs.prepare.outputs.version }}" -m "deployed viewer version ${{ needs.prepare.outputs.version }}"
                  git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "viewer@${{ needs.prepare.outputs.version }}"

            - name: Prepare GitHub release notes
              if: inputs.release_type != 'patch'
              id: release-notes
              shell: bash
              env:
                  RELEASE_NOTES_FILE: ${{ inputs.release_notes_file }}
              run: |
                  NOTES_FILE="${RUNNER_TEMP}/viewer-release-notes.md"
                  if [[ -n "${RELEASE_NOTES_FILE}" ]]; then
                    cp "${RELEASE_NOTES_FILE}" "${NOTES_FILE}"
                  else
                    : > "${NOTES_FILE}"
                  fi
                  echo "body_path=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"

            - name: Publish GitHub release
              if: inputs.release_type != 'patch'
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  tag_name: viewer@${{ needs.prepare.outputs.version }}
                  name: Viewer ${{ needs.prepare.outputs.version }}${{ inputs.codename && format(' - {0}', inputs.codename) || '' }}
                  generate_release_notes: true
                  body_path: ${{ steps.release-notes.outputs.body_path }}

            - name: Create cross-repo contents GitHub App token
              id: cross-repo-contents-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  owner: shapediver
                  repositories: |
                      Newsfeed
                      ViewerExamples
                  permission-contents: write

            - name: Create downstream pull-request GitHub App token
              id: downstream-pr-token
              continue-on-error: true
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  owner: shapediver
                  repositories: |
                      AppBuilderSdk
                      ShapeDiverPlatformFrontend
                  permission-contents: write
                  permission-pull-requests: write

            - name: Create newsfeed entry
              if: inputs.release_type != 'patch'
              shell: bash
              env:
                  GH_TOKEN: ${{ steps.cross-repo-contents-token.outputs.token }}
                  VERSION: ${{ needs.prepare.outputs.version }}
                  CODENAME: ${{ inputs.codename }}
              run: |
                  MINOR="$(echo "${VERSION}" | cut -d. -f1,2)"
                  DATE="$(date -u +%Y-%m-%d)"
                  GITHUB_URL="https://github.com/shapediver/Viewer/releases/tag/viewer@${VERSION}"
                  FILENAME="viewer-release-${VERSION}.md"

                  if [[ -n "${CODENAME}" ]]; then
                    DESC="ShapeDiver Viewer version ${MINOR} (${CODENAME}) has been released."
                  else
                    DESC="ShapeDiver Viewer version ${MINOR} has been released."
                  fi

                  cat > "/tmp/${FILENAME}" << EOF
                  ---
                  title: "Viewer Release ${MINOR}"
                  description: "${DESC}"
                  pubDate: ${DATE}
                  category: release-notes
                  tags:
                    - Viewer
                  author: "Michael Oppitz"
                  externalUrl: "${GITHUB_URL}"
                  ---

                  The ShapeDiver Viewer version ${MINOR} has been released and is available via npm and CDN. Read the full [Viewer ${MINOR} release notes](${GITHUB_URL}).
                  EOF

                  CONTENT="$(base64 -w0 "/tmp/${FILENAME}")"

                  gh api "repos/shapediver/Newsfeed/contents/src/content/news/${FILENAME}" \
                    --method PUT \
                    -f message="Add viewer release ${MINOR} newsfeed entry" \
                    -f content="${CONTENT}" \
                    -f branch="development"

                  echo "Created newsfeed entry: ${FILENAME}"

            - name: Trigger ViewerExamples deployment
              shell: bash
              env:
                  GH_TOKEN: ${{ steps.cross-repo-contents-token.outputs.token }}
              run: |
                  VERSION="${{ needs.prepare.outputs.version }}"
                  gh api "repos/shapediver/ViewerExamples/dispatches" \
                    --method POST \
                    -f event_type="viewer-release" \
                    -f client_payload[version]="${VERSION}"
                  echo "Dispatched viewer-release event (${VERSION}) to ViewerExamples."

            - name: Create pull requests for downstream repos
              if: steps.downstream-pr-token.outcome == 'success'
              continue-on-error: true
              shell: bash
              env:
                  GH_TOKEN: ${{ steps.downstream-pr-token.outputs.token }}
              run: |
                  VERSION="${{ needs.prepare.outputs.version }}"
                  GITHUB_URL="https://github.com/shapediver/Viewer/releases/tag/viewer@${VERSION}"
                  BRANCH_NAME="chore/viewer-release-${VERSION}"
                  PR_TITLE="chore: update Viewer dependency to ${VERSION}"

                  # Build PR body with actual newlines
                  PR_BODY=""
                  PR_BODY+="A new Viewer version **${VERSION}** has been released."
                  PR_BODY+=$'\n\n'
                  PR_BODY+="[Viewer ${VERSION} release notes](${GITHUB_URL})"
                  PR_BODY+=$'\n\n'
                  PR_BODY+="Update the @shapediver/viewer dependency version to **${VERSION}** and test compatibility."

                  for REPO in AppBuilderSdk ShapeDiverPlatformFrontend; do
                    FULL_REPO="shapediver/${REPO}"
                    echo "--- Processing ${FULL_REPO} ---"

                    DEFAULT_BRANCH=$(gh api "repos/${FULL_REPO}" --jq '.default_branch' 2>/dev/null) || {
                      echo "Could not fetch ${FULL_REPO}; skipping."
                      continue
                    }
                    echo "Default branch: ${DEFAULT_BRANCH}"

                    PR_EXISTS=$(gh api "repos/${FULL_REPO}/pulls?head=shapediver:${BRANCH_NAME}&state=open" --jq '.[0].html_url' 2>/dev/null || echo "")
                    if [[ -n "${PR_EXISTS}" ]]; then
                      echo "PR already exists: ${PR_EXISTS}"
                      continue
                    fi

                    BRANCH_EXISTS=$(gh api "repos/${FULL_REPO}/git/refs/heads/${BRANCH_NAME}" --jq '.ref' 2>/dev/null || echo "")
                    if [[ -n "${BRANCH_EXISTS}" ]]; then
                      echo "Branch ${BRANCH_NAME} already exists without an open PR; deleting it."
                      gh api "repos/${FULL_REPO}/git/refs/heads/${BRANCH_NAME}" --method DELETE || echo "Failed to delete old branch."
                    fi

                    BASE_SHA=$(gh api "repos/${FULL_REPO}/git/refs/heads/${DEFAULT_BRANCH}" --jq '.object.sha' 2>/dev/null) || {
                      echo "Could not get base SHA; skipping."
                      continue
                    }
                    gh api "repos/${FULL_REPO}/git/refs" --method POST \
                      -f ref="refs/heads/${BRANCH_NAME}" \
                      -f sha="${BASE_SHA}" || {
                      echo "Failed to create branch; skipping."
                      continue
                    }
                    echo "Created branch ${BRANCH_NAME}"

                    MARKER_CONTENT=$(printf '# Viewer %s release\n\n%s\n\nUpdate @shapediver/viewer dependencies to %s and test compatibility.\n' "${VERSION}" "${GITHUB_URL}" "${VERSION}" | base64 -w0)
                    gh api "repos/${FULL_REPO}/contents/.github/viewer-release-${VERSION}.md" \
                      --method PUT \
                      -f message="chore: add Viewer ${VERSION} release marker" \
                      -f content="${MARKER_CONTENT}" \
                      -f branch="${BRANCH_NAME}" || {
                      echo "Failed to create marker file; skipping PR creation."
                      continue
                    }
                    echo "Created marker file for ${VERSION}"

                    PR_URL=$(gh api "repos/${FULL_REPO}/pulls" --method POST \
                      -f title="${PR_TITLE}" \
                      -f body="${PR_BODY}" \
                      -f head="${BRANCH_NAME}" \
                      -f base="${DEFAULT_BRANCH}" \
                      --jq '.html_url' 2>/dev/null) || {
                      echo "Failed to create PR for ${FULL_REPO}."
                      continue
                    }
                    echo "Created PR: ${PR_URL}"
                  done

                  echo "All downstream PRs processed."

            - name: Notify Slack
              if: always()
              continue-on-error: true
              shell: bash
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                  STATUS: ${{ job.status }}
                  WORKFLOW: ${{ github.workflow }}
                  BRANCH: ${{ github.ref_name }}
                  SHA: ${{ github.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
              run: |
                  if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
                    echo "SLACK_WEBHOOK_URL not configured; skipping Slack notification."
                    exit 0
                  fi

                  case "$STATUS" in
                    success)
                      COLOR="#36a64f"
                      EMOJI=":white_check_mark:"
                      STATUS_LABEL="Succeeded"
                      ;;
                    failure)
                      COLOR="#cc0000"
                      EMOJI=":x:"
                      STATUS_LABEL="Failed"
                      ;;
                    cancelled)
                      COLOR="#808080"
                      EMOJI=":warning:"
                      STATUS_LABEL="Cancelled"
                      ;;
                    *)
                      COLOR="#808080"
                      EMOJI=":warning:"
                      STATUS_LABEL="$STATUS"
                      ;;
                  esac

                  SHORT_SHA="${SHA:0:7}"
                  PAYLOAD="$(jq -cn \
                    --arg color "$COLOR" \
                    --arg emoji "$EMOJI" \
                    --arg statusLabel "$STATUS_LABEL" \
                    --arg workflow "$WORKFLOW" \
                    --arg branch "$BRANCH" \
                    --arg commitUrl "$COMMIT_URL" \
                    --arg shortSha "$SHORT_SHA" \
                    --arg runUrl "$RUN_URL" \
                    '{attachments:[{color:$color,blocks:[{type:"section",text:{type:"mrkdwn",text:($emoji + " *Deployment finished*")}},{type:"section",fields:[{type:"mrkdwn",text:("*Status:*\n" + $statusLabel)},{type:"mrkdwn",text:("*Workflow:*\n" + $workflow)},{type:"mrkdwn",text:("*Branch:*\n`" + $branch + "`")},{type:"mrkdwn",text:("*Commit:*\n<" + $commitUrl + "|`" + $shortSha + "`>")} ]},{type:"actions",elements:[{type:"button",text:{type:"plain_text",text:"View Run"},url:$runUrl}]}]}]}')"

                  curl -sS --max-time 15 -X POST -H "Content-type: application/json" --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" >/dev/null || echo "Slack notification failed."

            - name: Collect finalize failure artifacts
              if: failure()
              shell: bash
              run: |
                  rm -rf .github-artifacts/failure
                  mkdir -p .github-artifacts/failure/tests

                  if [[ -f lerna-debug.log ]]; then
                    cp lerna-debug.log .github-artifacts/failure/
                  fi

                  if [[ -d tests/playwright-report ]]; then
                    cp -R tests/playwright-report .github-artifacts/failure/tests/
                  fi

                  if [[ -d tests/test-results ]]; then
                    cp -R tests/test-results .github-artifacts/failure/tests/
                  fi

            - name: Upload finalize failure artifacts
              if: failure()
              timeout-minutes: 5
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: release-finalize-failure-artifacts
                  if-no-files-found: ignore
                  compression-level: 0
                  path: .github-artifacts/failure/
