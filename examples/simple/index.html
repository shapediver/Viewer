<!DOCTYPE html>
<html class="dark">

<head>
    <title>ShapeDiver</title>
    <link rel="stylesheet" href="https://unpkg.com/flowbite@1.4.7/dist/flowbite.min.css" />

</head>

<body>
    <div style="width: calc(100% - 20rem); height: 100%; display: flex; position: absolute; left: 20rem; top: 0%; background: #6b7280;">
        <canvas id="canvas"></canvas>
    </div>
    <div id="menu" style="position: absolute; width: 20rem; overflow-y: scroll; height: 100%;">
    </div>
    <div style="right: 0%; position: absolute;">
        <button type="button" id="materialJsonDownload" class="text-white bg-gray-800 hover:bg-gray-900 focus:outline-none focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 mr-2 mb-2 dark:bg-gray-800 dark:hover:bg-gray-700 dark:focus:ring-gray-700 dark:border-gray-700">Download JSON</button>
        <br>
        <input type="file" id="materialJsonUpload" accept="application/json,text/json">
    </div>

    <script type="module" src="./bundle.js"></script>

    <script src="https://unpkg.com/flowbite@1.4.7/dist/flowbite.js"></script>
</body>

</html>
