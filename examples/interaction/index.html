<!doctype html>
<html>
	<head>
		<title>ShapeDiver</title>
	</head>

	<body>
		<div
			style="
				width: 100%;
				height: 100%;
				position: absolute;
				left: 0%;
				top: 0%;
			"
		>
			<canvas id="canvas"></canvas>
		</div>
		<input
			id="bottom"
			draggable="false"
			type="image"
			style="position: absolute; left: 25px; top: 25px"
			width="100"
			height="100"
			src="https://viewer.shapediver.com/v3/images/me.png"
			onpointerdown="window.addBottomShelf()"
		/>
		<input
			id="top"
			draggable="false"
			type="image"
			style="position: absolute; left: 125px; top: 25px"
			width="100"
			height="100"
			src="https://viewer.shapediver.com/v3/images/me.png"
			onpointerdown="window.addTopShelf()"
		/>
		<script type="module" src="./bundle.js"></script>
	</body>
</html>
