<!DOCTYPE html>
<html>

<head>
    <title>ShapeDiver</title>
    <style>
        /* The slider */
        #slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
        }

        #slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

        /* The switch - the box around the slider */
        .switch {
            position: relative;
            display: block;
            width: 60px;
            height: 34px;
            float: left;
        }

        /* Hide default HTML checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        input:checked+.slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }

        /* Rounded sliders */
        #slider.round {
            border-radius: 34px;
        }

        #slider.round:before {
            border-radius: 50%;
        }

        #s {
            -webkit-appearance: none;
            width: 100%;
            height: 15px;
            border-radius: 5px;
            background: #d3d3d3;
            outline: none;
            -webkit-transition: .2s;
            transition: opacity .2s;
        }

        #s::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #4285f4;
            cursor: pointer;
        }

        #s::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #4285f4;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id='part1' style="visibility: hidden;">
        <div style="width: 100%; height: 100%; display: flex; position: absolute; left: 0%; top: 0%">
            <canvas id="canvas"></canvas>
        </div>
        <input type="image" style="position: absolute; left: 25px; top: 25px; " width="150" height="150"
            src="https://developers.google.com/ar/develop/java/images/ic_view_in_ar_new_googblue_48dp.png"
            onclick="window.loadAR()" />
        <div
            style="position: absolute; right: 25px; top: 25px; border-radius: 25px; background: #4285f4; padding: 20px; color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
            <p style="font-size: xx-large;margin:0px; text-align: center;" id="bb"></p>
            <div style="text-align: center; margin-top: 15px;">

                <label class="switch">
                    <input type="checkbox" id="autoScaling" checked>
                    <span id="slider" class="slider round"></span>
                </label>
                <label
                    style="font-size: x-large; font-family: Arial, Helvetica, sans-serif; width: 100px;">Auto-Scaling</label>
            </div>
            <div id='scalingGroup'>
                <input style="width: 100%; height:50px;" type="range" min="0.01" max="10" value="1" class="slider"
                    id="scale">
                <div style="text-align: center;">
                    <input
                        style="font-size: x-large;border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 100px;"
                        type="text" id="min">
                    <input
                        style="font-size: x-large;border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 100px;"
                        type="text" id="max">
                    <input
                        style="font-size: x-large;border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 100px;"
                        type="text" id="value">
                </div>
                <div style="text-align: center;">
                    <input disabled='true'
                        style="font-size: x-large;background: #4285f4; color: #ffffff; font-family: Arial, Helvetica, sans-serif; text-align: center; border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 100px;"
                        type="text" value="min">
                    <input disabled='true'
                        style="font-size: x-large;background: #4285f4; color: #ffffff; font-family: Arial, Helvetica, sans-serif; text-align: center; border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 100px;"
                        type="text" value="max">
                    <input disabled='true'
                        style="font-size: x-large;background: #4285f4; color: #ffffff; font-family: Arial, Helvetica, sans-serif; text-align: center; border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 100px;"
                        type="text" value="value">
                </div>
            </div>
        </div>

        <div style="left: 5%; margin: 0px; position: absolute; bottom: 5%; width: 95%; ">
            <input style="margin: 0px; width: 90%;" type="range" min="0" max="8" value="0" class="slider" id="s">
        </div>
    </div>
    <div id='part2'
        style=" position: absolute; left: 50%; top: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%);">
        <div
            style="border-radius: 25px; background: #4285f4; padding: 20px; color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
            <div style="text-align: center;">
                <input id='ticket'
                    style="border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 85%; font-size: x-large;"
                    type="text"
                    value="1ded0499e27f4660dd6358aa230f3b76999091db1b6e98832dfb76778512342513ddf448ca958fb10645488df53c68c681cedf39c6981d56170a66c1c3fc07a33aef19078137903b5fb257efd75f8eea4f715d73ada2dee930dcdb161733ebe8f2a09f997c0279-0afc69935ed8170303e9cae2509ea1bd">
                <button
                    style=" font-size: x-large;border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; "
                    id='submit'>Submit</button>
                </br>
                </br>
                <p style="margin:0px; text-align: center; font-size: large;" id="info">This feature is currently only
                    available on
                    sddev2.eu-central-1.shapediver.com, so please prove a ticket from that system.</p>
            </div>
        </div>
    </div>

    <script type="module" src="./bundle.js"></script>
</body>

</html>
