<!DOCTYPE html>
<html>

<head>
    <title>ShapeDiver</title>
</head>

<body>
    <div style="width: 100%; height: 100%; display: flex; position: absolute; left: 0%; top: 0%">
        <canvas id="canvas"></canvas>
    </div>
    <input type="image"  style="position: absolute; left: 25px; top: 25px" src="https://developers.google.com/ar/develop/java/images/ic_view_in_ar_new_googblue_48dp.png" onclick="window.loadAR()"/>
    
    <div style=" position: absolute; right: 25px; top: 25px; border-radius: 25px; background: #4285f4; padding: 20px; color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
        <p style="margin:0px; text-align: center;" id="bb"></p>
        <input type="range" min="0.01" max="10" value="1" class="slider" id="scale">
        <div style="text-align: center;">
            <input style="border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 35px;"type="text" id="min">
            <input style="border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 35px;"type="text" id="max">
            <input style="border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 35px;"type="text" id="value">
        </div>
        <div style="text-align: center;">
            <input disabled='true' style="background: #4285f4; color: #ffffff; font-family: Arial, Helvetica, sans-serif; text-align: center; border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 35px;"type="text" value="min">
            <input disabled='true' style="background: #4285f4; color: #ffffff; font-family: Arial, Helvetica, sans-serif; text-align: center; border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 35px;"type="text" value="max">
            <input disabled='true' style="background: #4285f4; color: #ffffff; font-family: Arial, Helvetica, sans-serif; text-align: center; border-radius: 5px; border-width: 0px; font-family: Arial, Helvetica, sans-serif; width: 35px;"type="text" value="value">
        </div>
    </div>
    
    <script type="module" src="./bundle.js"></script>
</body>

</html>
